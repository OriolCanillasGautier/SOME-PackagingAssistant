<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PackAssist — Heightmap Packing Benchmark</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
        h1 { margin-bottom: 8px; color: #4fc3f7; }
        .subtitle { color: #888; margin-bottom: 20px; font-size: 14px; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 30px; }
        th, td { padding: 8px 12px; text-align: left; border: 1px solid #333; }
        th { background: #2a2a4e; color: #4fc3f7; }
        tr:nth-child(even) { background: #1e1e3a; }
        .pass { color: #4caf50; font-weight: bold; }
        .fail { color: #f44336; font-weight: bold; }
        .warn { color: #ff9800; font-weight: bold; }
        .info { color: #888; font-size: 12px; }
        #status { padding: 12px; background: #2a2a4e; border-radius: 6px; margin-bottom: 16px; }
        #results { margin-top: 16px; }
        button { padding: 10px 24px; background: #4fc3f7; color: #1a1a2e; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-bottom: 16px; }
        button:hover { background: #29b6f6; }
        button:disabled { background: #555; cursor: not-allowed; }
        .section { margin-bottom: 24px; }
        .section h2 { color: #4fc3f7; margin-bottom: 8px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>PackAssist Heightmap Benchmark</h1>
    <p class="subtitle">Tests packing density, orientation handling, and consistency across mesh simplifications</p>
    <button id="runBtn" onclick="runBenchmark()">Run Benchmark</button>
    <div id="status">Ready. Click "Run Benchmark" to start.</div>
    <div id="results"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/",
            "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.0/src/index.js"
        }
    }
    </script>
    <script type="module">
    import * as THREE from 'three';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';
    import { computeBoundsTree, disposeBoundsTree } from 'three-mesh-bvh';

    if (!THREE.BufferGeometry.prototype.computeBoundsTree) {
        THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
    }
    if (!THREE.BufferGeometry.prototype.disposeBoundsTree) {
        THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
    }

    const { SceneManager } = await import('./js/visualization/scene.js?v=q1_legacy_49');

    const canvas = document.createElement('canvas');
    canvas.width = 100; canvas.height = 100;
    const scene = new SceneManager(canvas);

    // ===== STL LOADING =====

    const stlLoader = new STLLoader();
    const stlCache = {};

    async function loadSTL(path) {
        if (stlCache[path]) return stlCache[path].clone();
        const resp = await fetch(path);
        if (!resp.ok) throw new Error(`Failed to load ${path}: ${resp.status}`);
        const buf = await resp.arrayBuffer();
        const geom = stlLoader.parse(buf);
        geom.computeBoundingBox();
        // Center on XZ, base at Y=0
        const bb = geom.boundingBox;
        const cx = (bb.min.x + bb.max.x) / 2;
        const cy = bb.min.y;
        const cz = (bb.min.z + bb.max.z) / 2;
        geom.translate(-cx, -cy, -cz);
        geom.computeBoundingBox();
        stlCache[path] = geom;
        return geom.clone();
    }

    function geomDims(g) {
        g.computeBoundingBox();
        const b = g.boundingBox;
        return {
            x: (b.max.x - b.min.x).toFixed(1),
            y: (b.max.y - b.min.y).toFixed(1),
            z: (b.max.z - b.min.z).toFixed(1)
        };
    }

    // ===== PACK FUNCTION =====

    async function packDryRun(stlGeometry, boxL, boxW, boxH, opts = {}) {
        const result = await scene.addPackedSTLHeightMapAsync({
            stlGeometry,
            orientationPool: opts.orientationPool || null,
            useMixedOrientations: !!opts.orientationPool,
            maxDraw: opts.maxDraw || 500,
            maxTry: opts.maxTry || 2000,
            packingGap: opts.packingGap || 0,
            boxL, boxW, boxH,
            stackingQuality: opts.stackingQuality ?? 2,
            searchEffort: opts.searchEffort || 'balanced',
            placementStrategy: opts.placementStrategy || 'stable-contact',
            dryRun: true
        });
        return typeof result === 'number' ? result : result.count;
    }

    // ===== PROCEDURAL SHAPES (fallback) =====

    function makeBoxGeom(lx, ly, lz) {
        const g = new THREE.BoxGeometry(lx, ly, lz);
        g.translate(0, ly / 2, 0);
        g.computeBoundingBox();
        return g;
    }

    // ===== TEST DEFINITIONS =====
    // Real STL file paths
    const STL_TRIANGLE = 'library/triangle-20x40x20.stl';
    const STL_CYLINDER = 'library/cylinder-r15-h30.stl';
    const STL_LBRACKET = 'library/L-bracket-30x40x20.stl';
    const STL_REAL_PART = 'library/6683688_reduit.stl';

    const BOX_SMALL  = [100, 100, 100];
    const BOX_DEFAULT = [160, 160, 160];
    const BOX_LARGE  = [200, 200, 300];

    const tests = [];

    // ---- A) TRIANGLE STL — the user's main test piece ----

    tests.push({
        name: 'Triangle STL · 160³ · Q1',
        stl: STL_TRIANGLE, box: BOX_DEFAULT, quality: 1,
        expectedMin: 50,
        notes: 'Right-angle triangle 20×40×20 in 160³ box. Q1 = max contact.'
    });

    tests.push({
        name: 'Triangle STL · 160³ · Q2',
        stl: STL_TRIANGLE, box: BOX_DEFAULT, quality: 2,
        expectedMin: 50,
        notes: 'Same piece, Q2 = balanced (should be best count).'
    });

    tests.push({
        name: 'Triangle STL · 160³ · Q3',
        stl: STL_TRIANGLE, box: BOX_DEFAULT, quality: 3,
        expectedMin: 40,
        notes: 'Same piece, Q3 = safe/strict.'
    });

    tests.push({
        name: 'Triangle STL · 100³ · Q2',
        stl: STL_TRIANGLE, box: BOX_SMALL, quality: 2,
        expectedMin: 15,
        notes: 'Triangle in smaller box — fewer pieces expected.'
    });

    tests.push({
        name: 'Triangle STL · 200×200×300 · Q2',
        stl: STL_TRIANGLE, box: BOX_LARGE, quality: 2,
        expectedMin: 150,
        notes: 'Triangle in large box — many pieces expected.'
    });

    // Monotonicity: bigger box >= smaller box
    tests.push({
        name: 'Triangle monotonicity: 100³ vs 160³',
        stl: STL_TRIANGLE, box: BOX_SMALL, box2: BOX_DEFAULT, quality: 2,
        isMonotonicity: true,
        notes: 'Bigger box must produce >= pieces.'
    });

    // ---- B) CYLINDER STL ----

    tests.push({
        name: 'Cylinder STL · 160³ · Q1',
        stl: STL_CYLINDER, box: BOX_DEFAULT, quality: 1,
        expectedMin: 20,
        notes: 'Cylinder r=15 h=30 in 160³. Q1.'
    });

    tests.push({
        name: 'Cylinder STL · 160³ · Q2',
        stl: STL_CYLINDER, box: BOX_DEFAULT, quality: 2,
        expectedMin: 20,
        notes: 'Cylinder Q2.'
    });

    tests.push({
        name: 'Cylinder STL · 160³ · Q3',
        stl: STL_CYLINDER, box: BOX_DEFAULT, quality: 3,
        expectedMin: 15,
        notes: 'Cylinder Q3.'
    });

    // ---- C) L-BRACKET STL ----

    tests.push({
        name: 'L-bracket STL · 160³ · Q1',
        stl: STL_LBRACKET, box: BOX_DEFAULT, quality: 1,
        expectedMin: 30,
        notes: 'L-bracket 30×40×20 in 160³. Q1.'
    });

    tests.push({
        name: 'L-bracket STL · 160³ · Q2',
        stl: STL_LBRACKET, box: BOX_DEFAULT, quality: 2,
        expectedMin: 30,
        notes: 'L-bracket Q2.'
    });

    tests.push({
        name: 'L-bracket STL · 160³ · Q3',
        stl: STL_LBRACKET, box: BOX_DEFAULT, quality: 3,
        expectedMin: 20,
        notes: 'L-bracket Q3.'
    });

    // ---- D) REAL PART (6683688_reduit.stl) ----

    tests.push({
        name: 'Real part STL · 160³ · Q2',
        stl: STL_REAL_PART, box: BOX_DEFAULT, quality: 2,
        expectedMin: 1,
        notes: 'Actual part from library. Dimensions vary — just verify it runs without error.'
    });

    tests.push({
        name: 'Real part STL · 200×200×300 · Q2',
        stl: STL_REAL_PART, box: BOX_LARGE, quality: 2,
        expectedMin: 1,
        notes: 'Real part in large box.'
    });

    // ---- E) SANITY CHECKS (procedural) ----

    tests.push({
        name: 'Box 10×20×15 · 100³ · Q2 (sanity)',
        piece: () => makeBoxGeom(10, 20, 15), box: BOX_SMALL, quality: 2,
        expectedMin: 200,
        notes: 'Procedural box sanity check. 10×6=60 floor × 5 layers = 300 theoretical.'
    });

    tests.push({
        name: 'Piece too tall · Q2',
        piece: () => makeBoxGeom(50, 200, 50), box: BOX_DEFAULT, quality: 2,
        expectedExact: 0,
        notes: 'Piece 200mm tall in 160mm box — must be 0.'
    });

    // ===== RUNNER =====

    async function runBenchmark() {
        const btn = document.getElementById('runBtn');
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');
        btn.disabled = true;
        resultsEl.innerHTML = '';

        let html = '<table><tr><th>#</th><th>Test</th><th>Piece</th><th>Count</th><th>Expected</th><th>Result</th><th>Time</th><th>Notes</th></tr>';
        let passed = 0, failed = 0, warned = 0;

        for (let i = 0; i < tests.length; i++) {
            const t = tests[i];
            statusEl.textContent = `Running test ${i + 1}/${tests.length}: ${t.name}...`;

            try {
                // Load geometry
                const geom = t.stl ? await loadSTL(t.stl) : t.piece();
                const dims = geomDims(geom);
                const dimStr = `${dims.x}×${dims.y}×${dims.z}`;
                const opts = { stackingQuality: t.quality || 2 };

                if (t.isMonotonicity) {
                    const geom2 = t.stl ? await loadSTL(t.stl) : t.piece();
                    const t0 = performance.now();
                    const count1 = await packDryRun(geom, t.box[0], t.box[1], t.box[2], opts);
                    const count2 = await packDryRun(geom2, t.box2[0], t.box2[1], t.box2[2], opts);
                    const ms = (performance.now() - t0).toFixed(0);
                    const ok = count2 >= count1;
                    if (ok) passed++; else failed++;
                    html += `<tr><td>${i+1}</td><td>${t.name}</td><td>${dimStr}</td>
                        <td>${count1} → ${count2}</td><td>c2 >= c1</td>
                        <td class="${ok?'pass':'fail'}">${ok?'PASS':'FAIL'}</td>
                        <td>${ms}ms</td><td class="info">${t.notes}</td></tr>`;
                } else {
                    const t0 = performance.now();
                    const count = await packDryRun(geom, t.box[0], t.box[1], t.box[2], opts);
                    const ms = (performance.now() - t0).toFixed(0);

                    let ok, expectedStr, cls;
                    if (t.expectedExact !== undefined) {
                        ok = count === t.expectedExact;
                        expectedStr = `== ${t.expectedExact}`;
                        cls = ok ? 'pass' : 'fail';
                        if (ok) passed++; else failed++;
                    } else {
                        ok = count >= t.expectedMin;
                        expectedStr = `>= ${t.expectedMin}`;
                        cls = ok ? 'pass' : (count >= t.expectedMin * 0.8 ? 'warn' : 'fail');
                        if (ok) passed++; else if (count >= t.expectedMin * 0.8) warned++; else failed++;
                    }

                    html += `<tr><td>${i+1}</td><td>${t.name}</td><td>${dimStr}</td>
                        <td>${count}</td><td>${expectedStr}</td>
                        <td class="${cls}">${cls==='pass'?'PASS':cls==='warn'?'WARN':'FAIL'}</td>
                        <td>${ms}ms</td><td class="info">${t.notes}</td></tr>`;
                }
            } catch (err) {
                failed++;
                html += `<tr><td>${i+1}</td><td>${t.name}</td><td>-</td>
                    <td colspan="3" class="fail">ERROR: ${err.message}</td>
                    <td>-</td><td class="info">${t.notes}</td></tr>`;
                console.error(`Test ${i+1} error:`, err);
            }
        }

        html += '</table>';
        html += `<p><span class="pass">${passed} passed</span> / <span class="warn">${warned} warnings</span> / <span class="fail">${failed} failed</span> out of ${tests.length} tests</p>`;
        resultsEl.innerHTML = html;
        statusEl.textContent = `Done. ${passed}/${tests.length} passed.`;
        btn.disabled = false;
    }

    window.runBenchmark = runBenchmark;

    // Auto-run mode: append ?auto=1 to URL
    if (new URLSearchParams(window.location.search).has('auto')) {
        (async () => {
            const statusEl = document.getElementById('status');
            document.getElementById('runBtn').disabled = true;
            statusEl.textContent = 'Auto-run mode — starting benchmark...';

            const testResults = [];
            for (let i = 0; i < tests.length; i++) {
                const t = tests[i];
                statusEl.textContent = `[auto] Test ${i + 1}/${tests.length}: ${t.name}`;
                try {
                    const geom = t.stl ? await loadSTL(t.stl) : t.piece();
                    const dims = geomDims(geom);
                    const dimStr = `${dims.x}×${dims.y}×${dims.z}`;
                    const opts = { stackingQuality: t.quality || 2 };

                    if (t.isMonotonicity) {
                        const geom2 = t.stl ? await loadSTL(t.stl) : t.piece();
                        const t0 = performance.now();
                        const c1 = await packDryRun(geom, t.box[0], t.box[1], t.box[2], opts);
                        const c2 = await packDryRun(geom2, t.box2[0], t.box2[1], t.box2[2], opts);
                        const ms = performance.now() - t0;
                        const ok = c2 >= c1;
                        testResults.push({ id: i+1, name: t.name, dims: dimStr, result: ok?'PASS':'FAIL', counts: `${c1}→${c2}`, ms: Math.round(ms) });
                    } else {
                        const t0 = performance.now();
                        const count = await packDryRun(geom, t.box[0], t.box[1], t.box[2], opts);
                        const ms = performance.now() - t0;
                        let ok;
                        if (t.expectedExact !== undefined) ok = count === t.expectedExact;
                        else ok = count >= t.expectedMin;
                        const exp = t.expectedExact !== undefined ? `==${t.expectedExact}` : `>=${t.expectedMin}`;
                        testResults.push({ id: i+1, name: t.name, dims: dimStr, result: ok?'PASS':'FAIL', counts: `${count}(${exp})`, ms: Math.round(ms) });
                    }
                } catch (err) {
                    testResults.push({ id: i+1, name: t.name, dims: '-', result: 'ERROR', counts: err.message, ms: 0 });
                }
            }
            console.log('__BENCHMARK_RESULTS_START__');
            console.log(JSON.stringify(testResults, null, 2));
            console.log('__BENCHMARK_RESULTS_END__');
            statusEl.textContent = 'Auto-run complete.';
        })();
    }
    </script>
</body>
</html>
