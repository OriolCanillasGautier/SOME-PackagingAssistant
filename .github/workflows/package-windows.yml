name: package-windows

on:
  push:
    branches: [ "Gradio" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create venv and install deps
        run: |
          py -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r .\requirements.txt

      - name: Smoke test imports
        run: |
          .\.venv\Scripts\python.exe - << 'PY'
          import gradio, numpy, pandas
          print('smoke: ok')
          PY

      - name: Prepare runner artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path app.py -Destination dist\
          if (Test-Path README.md) { Copy-Item README.md dist\ }
          Copy-Item -Path requirements.txt -Destination dist\requirements.txt
          New-Item -ItemType Directory -Force -Path dist\scripts | Out-Null
          Copy-Item -Path scripts\run_windows.bat -Destination dist\scripts\run_windows.bat
          if (Test-Path scripts\install_windows.bat) { Copy-Item -Path scripts\install_windows.bat -Destination dist\scripts\install_windows.bat }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packassist-gradio-windows-runner
          path: dist

      - name: Build portable Python bundle (embedded + site-packages)
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '3.13.7'
          $url = "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip"
          New-Item -ItemType Directory -Force -Path dist_portable | Out-Null
          Copy-Item -Path app.py -Destination dist_portable\
          if (Test-Path README.md) { Copy-Item README.md dist_portable\ }
          Copy-Item -Path requirements.txt -Destination dist_portable\requirements.txt
          New-Item -ItemType Directory -Force -Path dist_portable\scripts | Out-Null
          if (Test-Path scripts\run_portable.bat) { Copy-Item -Path scripts\run_portable.bat -Destination dist_portable\scripts\run_portable.bat } else { Copy-Item -Path scripts\run_windows.bat -Destination dist_portable\scripts\run_windows.bat }
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip
          Expand-Archive -Path python-embed.zip -DestinationPath dist_portable\python -Force
          Remove-Item python-embed.zip
          New-Item -ItemType Directory -Force -Path dist_portable\python\Lib\site-packages | Out-Null
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r .\requirements.txt --target dist_portable\python\Lib\site-packages
          $pth = Get-ChildItem dist_portable\python -Filter "python*.pth" -Name | Select-Object -First 1
          if (-not $pth) { $pth = Get-ChildItem dist_portable\python -Filter "python*._pth" -Name | Select-Object -First 1 }
          if (-not $pth) { throw "Could not find python _pth file in embedded distribution" }
          $pthPath = Join-Path dist_portable\python $pth
          Add-Content -Path $pthPath -Value "."
          Add-Content -Path $pthPath -Value "Lib\site-packages"
          Add-Content -Path $pthPath -Value "import site"

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: packassist-gradio-windows-portable
          path: dist_portable

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download runner artifact
        uses: actions/download-artifact@v4
        with:
          name: packassist-gradio-windows-runner
          path: runner
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: packassist-gradio-windows-portable
          path: portable
      - name: Create ZIPs
        run: |
          zip -r packassist-runner.zip runner
          zip -r packassist-portable.zip portable
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packassist-runner.zip
            packassist-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
